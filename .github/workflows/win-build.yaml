name: Windows Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: aws-actions/setup-aws-cli@v2

      - name: Download After Effects SDK
        run: |
          aws s3 cp "s3://ae-sdk/AfterEffectsSDK_25.2_20_win.zip" "./AfterEffectsSDK_25.2_20_win.zip" --endpoint-url "${{ secrets.AESDK_ENDPOINT_URL }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AESDK_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AESDK_SECRET_ACCESS_KEY }}
      
      - name: Unzip and Place After Effects SDK
        run: |
          Expand-Archive -Path "AfterEffectsSDK_25.2_20_win.zip" -Force
          pushd ".\AfterEffectsSDK_25.2_20_win\ae25.2_20.64bit.AfterEffectsSDK"
          .\extractzstd.bat
          popd
          Move-Item -Path "AfterEffectsSDK_25.2_20_win\ae25.2_20.64bit.AfterEffectsSDK\AfterEffectsSDK\Examples\*" -Destination ".\AfterEffectsSDK" -Force
        shell: powershell

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Archive artifacts
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $zipName = "AEVE-Plugins_${date}_Windows_x64.zip"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build\Plugins\Release\*.aex" -Destination dist\
          Compress-Archive -Path dist\* -DestinationPath dist\$zipName
        shell: powershell
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          path: dist/AEVE-Plugins_*.zip
